<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERM_ACCESS // V1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Azeret Mono', monospace;
      background-color: #000;
      color: #ccc;
    }

    .cursor-blink {
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .selection-invert::selection {
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body class="p-8 min-h-screen flex flex-col selection-invert">

  <!-- Header -->
  <header class="mb-12 border-b border-gray-800 pb-4">
    <div class="flex justify-between items-end">
      <h1 class="text-4xl font-bold tracking-tighter text-white">SWARM_INDEX</h1>
      <div class="text-xs text-gray-500">
        USER: GUEST<br>
        PERM: READ_ONLY
      </div>
    </div>
  </header>

  <!-- Content Command -->
  <div class="mb-8 text-sm text-gray-500">
    <span class="text-green-500">$</span> ./list_active_swarms --verbose
  </div>

  <!-- The List -->
  <main class="space-y-4">

    <!-- Item 1 -->
    <div class="border border-gray-800 p-4 hover:bg-gray-900 transition-colors group cursor-pointer block">
      <div class="flex justify-between mb-2">
        <span class="font-bold text-white group-hover:underline">CMY_CUBE</span>
        <span class="text-xs border border-gray-700 px-1">ID: 001</span>
      </div>
      <div class="grid grid-cols-12 gap-4 text-xs text-gray-500">
        <div class="col-span-2">AGENTS: 05</div>
        <div class="col-span-2">STATUS: OK</div>
        <div class="col-span-8 overflow-hidden whitespace-nowrap text-ellipsis">
          Spatial primitives in responsive containers. > 98% pass rate.
        </div>
      </div>
    </div>

    <!-- Item 2 -->
    <div class="border border-gray-800 p-4 hover:bg-gray-900 transition-colors group cursor-pointer block opacity-50">
      <div class="flex justify-between mb-2">
        <span class="font-bold text-white group-hover:underline">NEURAL_LAYERS</span>
        <span class="text-xs border border-gray-700 px-1">ID: 002</span>
      </div>
      <div class="grid grid-cols-12 gap-4 text-xs text-gray-500">
        <div class="col-span-2">AGENTS: 12</div>
        <div class="col-span-2">STATUS: COMPILING</div>
        <div class="col-span-8 overflow-hidden whitespace-nowrap text-ellipsis">
          [################----] 80% complete.
        </div>
      </div>
    </div>

  </main>

  <footer class="mt-auto pt-12 text-xs text-gray-700">
    <span class="cursor-blink">_</span>
  </footer>

</body>

</html>
