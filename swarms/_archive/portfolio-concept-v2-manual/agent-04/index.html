<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Conservatory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Urbanist', sans-serif;
      background: linear-gradient(to bottom right, #f0fdf4, #ecfccb);
      color: #064e3b;
    }

    .glass {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .breathe {
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.02);
      }
    }
  </style>
</head>

<body class="min-h-screen p-8 flex items-center justify-center">

  <div class="glass w-full max-w-5xl rounded-[3rem] p-12 relative overflow-hidden">

    <!-- Organic shape -->
    <div
      class="absolute -top-20 -right-20 w-96 h-96 bg-green-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 breathe">
    </div>
    <div
      class="absolute -bottom-20 -left-20 w-96 h-96 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 breathe"
      style="animation-delay: 2s"></div>

    <header class="mb-16 flex justify-between items-center relative z-10">
      <h1 class="text-5xl font-light tracking-tight">Swarm<span class="font-bold">Garden</span></h1>
      <nav class="flex gap-6 text-sm font-bold uppercase tracking-widest opacity-60">
        <a href="#" class="hover:opacity-100 transition-opacity">Nursery</a>
        <a href="#" class="hover:opacity-100 transition-opacity">Archive</a>
      </nav>
    </header>

    <div class="grid grid-cols-3 gap-8 relative z-10">

      <!-- Card 1 -->
      <article class="group cursor-pointer">
        <div class="aspect-[4/5] glass rounded-2xl mb-4 relative overflow-hidden hover:bg-white/40 transition-colors">
          <div class="absolute inset-0 flex items-center justify-center opacity-30">
            <div
              class="w-24 h-24 rounded-lg border-2 border-green-800 rotate-12 group-hover:rotate-45 transition-transform duration-700">
            </div>
          </div>
        </div>
        <h3 class="text-xl font-bold">CMY System</h3>
        <p class="text-sm opacity-60">Spatial Growth / Gen 1</p>
      </article>

      <!-- Card 2 -->
      <article class="group cursor-pointer mt-12">
        <div class="aspect-[4/5] glass rounded-2xl mb-4 relative overflow-hidden hover:bg-white/40 transition-colors">
          <div class="absolute inset-0 flex items-center justify-center opacity-30">
            <div
              class="w-24 h-24 rounded-full border-2 border-green-800 scale-75 group-hover:scale-100 transition-transform duration-700">
            </div>
          </div>
        </div>
        <h3 class="text-xl font-bold">Neural Net</h3>
        <p class="text-sm opacity-60">Deep Roots / Gen 2</p>
      </article>

      <!-- Card 3 -->
      <article class="group cursor-pointer">
        <div
          class="aspect-[4/5] glass rounded-2xl mb-4 relative overflow-hidden hover:bg-white/40 transition-colors border-2 border-dashed border-green-800/20 flex items-center justify-center">
          <span class="text-2xl opacity-40">+</span>
        </div>
        <h3 class="text-xl font-bold">New Seed</h3>
        <p class="text-sm opacity-60">Ready to plant</p>
      </article>

    </div>

  </div>

</body>

</html>
