<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio_Swarm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #fdf6e3;
      color: #586e75;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .cell {
      background: white;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      box-shadow: 20px 20px 60px #d6d0c0, -20px -20px 60px #ffffff;
      transition: all 0.5s ease;
      animation: morph 8s ease-in-out infinite;
    }

    .cell:hover {
      border-radius: 50%;
      transform: scale(1.05);
      box-shadow: 10px 10px 30px #d6d0c0, -10px -10px 30px #ffffff;
    }

    @keyframes morph {
      0% {
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }

      33% {
        border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%;
      }

      66% {
        border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%;
      }

      100% {
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }
    }
  </style>
</head>

<body class="h-screen flex items-center justify-center relative">

  <h1 class="absolute top-8 left-8 text-2xl font-light tracking-wide mix-blend-multiply opacity-50">micro / swarm</h1>

  <div class="relative w-full max-w-4xl h-[60vh]">

    <!-- Cell 1 -->
    <div
      class="cell absolute top-0 left-1/4 w-64 h-64 flex flex-col items-center justify-center text-center p-8 cursor-pointer z-10">
      <div class="text-4xl mb-2 opacity-20">●</div>
      <h2 class="text-xl font-bold text-[#b58900]">CMY</h2>
      <p class="text-xs mt-2 opacity-60">Spatial Organism</p>
    </div>

    <!-- Cell 2 -->
    <div
      class="cell absolute bottom-0 right-1/4 w-56 h-56 flex flex-col items-center justify-center text-center p-8 cursor-pointer z-0"
      style="animation-delay: -2s;">
      <div class="text-4xl mb-2 opacity-20">✦</div>
      <h2 class="text-xl font-bold text-[#2aa198]">Neural</h2>
      <p class="text-xs mt-2 opacity-60">Deep Tissue</p>
    </div>

    <!-- Cell 3 -->
    <div
      class="cell absolute top-1/3 right-10 w-40 h-40 flex flex-col items-center justify-center text-center p-4 cursor-pointer z-0 opacity-80"
      style="animation-delay: -5s;">
      <span class="text-3xl text-[#d33682]">+</span>
    </div>

  </div>

  <!-- Microscope Overlay -->
  <div class="absolute inset-0 pointer-events-none border-[50px] border-white/50 rounded-[3rem] mix-blend-overlay">
  </div>

</body>

</html>
