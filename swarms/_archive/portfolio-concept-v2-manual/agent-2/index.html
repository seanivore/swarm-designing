<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Garden // V2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
      color: #004d40;
      overflow-x: hidden;
    }

    /* Glassmorphism Evolved */
    .glass-panel {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }

    .floating {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .btn-organic {
      border-radius: 9999px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-organic:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(0, 77, 64, 0.2);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-8">

  <!-- Ambient Background Elements -->
  <div
    class="fixed top-[-10%] right-[-5%] w-[50vh] h-[50vh] bg-teal-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse">
  </div>
  <div
    class="fixed bottom-[-10%] left-[-5%] w-[50vh] h-[50vh] bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"
    style="animation-delay: 2s"></div>

  <!-- Main Container -->
  <main
    class="w-full max-w-6xl h-[85vh] glass-panel rounded-[3rem] p-8 flex gap-8 relative overflow-hidden ring-4 ring-white/50">

    <!-- Sidebar Navigation -->
    <nav class="w-24 flex flex-col items-center justify-between py-4 z-10">
      <div
        class="w-12 h-12 bg-teal-600 rounded-2xl flex items-center justify-center text-white font-bold shadow-lg shadow-teal-600/20 logo">
        S</div>

      <div class="space-y-8 flex flex-col items-center">
        <div
          class="w-2 h-2 rounded-full bg-teal-600 opacity-20 hover:opacity-100 transition-all cursor-pointer hover:scale-150">
        </div>
        <div class="w-2 h-2 rounded-full bg-teal-600 opacity-100 cursor-pointer scale-125 ring-4 ring-teal-600/10">
        </div>
        <div
          class="w-2 h-2 rounded-full bg-teal-600 opacity-20 hover:opacity-100 transition-all cursor-pointer hover:scale-150">
        </div>
      </div>

      <div class="text-xs font-bold rotate-180 text-teal-800/30 writing-vertical">V.2.0.24</div>
    </nav>

    <!-- Content Area -->
    <section class="flex-1 rounded-[2.5rem] bg-white/40 p-8 flex flex-col relative overflow-y-auto">

      <header class="mb-12 flex justify-between items-end">
        <div>
          <h1 class="text-6xl font-extrabold tracking-tight text-teal-900 mb-2">The Conservatory.</h1>
          <p class="text-lg text-teal-700/60 font-medium">Cultivating digital organisms.</p>
        </div>
        <div class="flex gap-4">
          <button
            class="btn-organic px-6 py-2 bg-white text-teal-800 font-bold text-sm shadow-sm hover:bg-teal-50">Filter:
            All</button>
          <button
            class="btn-organic px-6 py-2 bg-teal-800 text-white font-bold text-sm shadow-lg shadow-teal-900/10">New Seed
            +</button>
        </div>
      </header>

      <!-- Gallery Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">

        <!-- Card 1 -->
        <article class="glass-panel p-1 rounded-3xl cursor-pointer hover:bg-white/80 transition-colors group floating">
          <div
            class="aspect-square bg-gradient-to-br from-yellow-100 to-orange-100 rounded-[1.3rem] mb-4 relative overflow-hidden">
            <div
              class="absolute inset-0 flex items-center justify-center opacity-40 group-hover:scale-110 transition-transform duration-700">
              <!-- SVG Shape -->
              <svg viewBox="0 0 100 100" class="w-32 h-32 fill-orange-400">
                <rect x="25" y="25" width="50" height="50" rx="10" />
              </svg>
            </div>
            <div
              class="absolute bottom-4 left-4 bg-white/50 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-orange-800">
              CMY Cube</div>
          </div>
          <div class="px-2 pb-2">
            <div class="flex justify-between items-center">
              <h3 class="font-bold text-lg text-teal-900">Spatial Growth</h3>
              <span class="text-xs text-teal-600 font-mono">5 Agents</span>
            </div>
          </div>
        </article>

        <!-- Card 2 -->
        <article class="glass-panel p-1 rounded-3xl cursor-pointer hover:bg-white/80 transition-colors group floating"
          style="animation-delay: -2s;">
          <div
            class="aspect-square bg-gradient-to-br from-indigo-100 to-purple-100 rounded-[1.3rem] mb-4 relative overflow-hidden">
            <div
              class="absolute inset-0 flex items-center justify-center opacity-40 group-hover:scale-110 transition-transform duration-700">
              <!-- SVG Shape -->
              <svg viewBox="0 0 100 100" class="w-32 h-32 fill-indigo-400">
                <circle cx="50" cy="50" r="30" />
              </svg>
            </div>
            <div
              class="absolute bottom-4 left-4 bg-white/50 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-indigo-800">
              Neural Net</div>
          </div>
          <div class="px-2 pb-2">
            <div class="flex justify-between items-center">
              <h3 class="font-bold text-lg text-teal-900">Deep Roots</h3>
              <span class="text-xs text-teal-600 font-mono">12 Agents</span>
            </div>
          </div>
        </article>

        <!-- Card 3 (Empty) -->
        <article
          class="border-2 border-dashed border-teal-800/10 rounded-3xl flex items-center justify-center aspect-[4/5] cursor-pointer hover:border-teal-800/30 transition-colors">
          <div class="text-center">
            <div
              class="w-12 h-12 bg-teal-800/5 rounded-full flex items-center justify-center mx-auto mb-2 text-2xl text-teal-800/40">
              +</div>
            <div class="text-sm font-bold text-teal-800/40">Plant New Swarm</div>
          </div>
        </article>

      </div>

    </section>

  </main>
</body>

</html>
