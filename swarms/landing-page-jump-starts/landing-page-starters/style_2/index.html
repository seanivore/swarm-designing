<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAM_FEED // MASTER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #050000;
      color: #a00;
      font-family: monospace;
      overflow: hidden;
    }

    .tv-noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    }

    .rec-dot {
      animation: blink 2s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }
  </style>
</head>

<body class="h-screen p-2 tv-noise grid grid-cols-2 grid-rows-2 gap-2">

  <!-- Feed 1 -->
  <div class="border border-red-900 bg-black relative p-2 group overflow-hidden">
    <div class="absolute top-2 left-2 bg-red-900 text-black px-1 text-xs font-bold">CAM_01: CMY_CUBE</div>
    <div class="absolute top-2 right-2 flex items-center gap-1">
      <div class="w-2 h-2 rounded-full bg-red-600 rec-dot"></div>
      <span class="text-[10px] text-red-600">REC</span>
    </div>

    <!-- Content Preview (Abstract) -->
    <div class="w-full h-full flex items-center justify-center opacity-30 group-hover:opacity-60 transition-opacity">
      <div class="w-24 h-24 border-4 border-red-800 rotate-45"></div>
    </div>

    <!-- Overlay Data -->
    <div class="absolute bottom-2 left-2 text-[10px] text-red-800">
      AGENTS: 05<br>
      ACT: 88%
    </div>
  </div>

  <!-- Feed 2 -->
  <div class="border border-red-900 bg-black relative p-2 group overflow-hidden">
    <div class="absolute top-2 left-2 border border-red-900 text-red-900 px-1 text-xs font-bold">CAM_02: NEURAL</div>
    <div class="absolute top-2 right-2 flex items-center gap-1">
      <span class="text-[10px] text-red-900">LIVE</span>
    </div>
    <div class="w-full h-full flex items-center justify-center opacity-30 group-hover:opacity-60 transition-opacity">
      <div class="grid grid-cols-4 gap-1">
        <div class="w-2 h-2 bg-red-800 rounded-full"></div>
        <div class="w-2 h-2 bg-red-800 rounded-full"></div>
        <div class="w-2 h-2 bg-red-800 rounded-full"></div>
        <div class="w-2 h-2 bg-red-800 rounded-full"></div>
      </div>
    </div>
  </div>

  <!-- Feed 3 -->
  <div class="border border-red-900 bg-black relative p-2 group overflow-hidden">
    <div class="absolute top-2 left-2 border border-red-900 text-red-900 px-1 text-xs font-bold">CAM_03: INFINITE</div>
    <div class="w-full h-full flex items-center justify-center opacity-20 group-hover:opacity-40 transition-opacity">
      <div class="flex flex-col gap-2 w-1/2">
        <div class="h-1 bg-red-900 w-full"></div>
        <div class="h-1 bg-red-900 w-full"></div>
        <div class="h-1 bg-red-900 w-full"></div>
      </div>
    </div>
  </div>

  <!-- Feed 4 (System) -->
  <div class="border border-red-900 bg-black relative p-2 flex flex-col justify-end">
    <div class="text-xs text-red-700 font-mono">
      > SYSTEM_DIAGNOSTIC<br>
      > MEMORY: OK<br>
      > UPTIME: 4291h<br>
      > _
    </div>
  </div>

</body>

</html>
