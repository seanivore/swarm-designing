<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWARM_ATLAS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f3f4f6;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background-image: radial-gradient(#9ca3af 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .iso-card {
      transform: rotateX(60deg) rotateZ(-45deg);
      transition: all 0.5s ease;
      box-shadow: -10px 10px 20px rgba(0, 0, 0, 0.1);
    }

    .iso-card:hover {
      transform: rotateX(60deg) rotateZ(-45deg) translateZ(20px);
      box-shadow: -20px 20px 40px rgba(0, 0, 0, 0.15);
    }

    .layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .topo-line {
      fill: none;
      stroke: #e5e7eb;
      stroke-width: 2;
    }
  </style>
</head>

<body class="h-screen w-screen relative perspective-[2000px] overflow-hidden">

  <!-- Topo Lines Background -->
  <svg class="absolute inset-0 w-full h-full opacity-50" xmlns="http://www.w3.org/2000/svg">
    <path class="topo-line" d="M0,100 C150,200 300,0 500,100 S800,300 1000,100" />
    <path class="topo-line" d="M0,300 C200,400 400,200 600,300 S900,500 1000,300" />
    <path class="topo-line" d="M0,600 C300,700 600,500 800,600 S1100,800 1200,600" />
  </svg>

  <!-- Isometric Grid -->
  <div
    class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] flex flex-wrap gap-12 justify-center items-center"
    style="transform-style: preserve-3d;">

    <!-- Plot 1 -->
    <div class="iso-card w-64 h-64 bg-white rounded-3xl relative group cursor-pointer border border-gray-200">
      <div
        class="absolute -top-12 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-2 py-1 text-xs font-bold rounded shadow-lg opacity-0 group-hover:opacity-100 transition-opacity transform -translate-y-10 group-hover:translate-y-0"
        style="transform: rotateZ(45deg) rotateX(-60deg);">
        CMY_CUBE (V1)
      </div>

      <!-- Building Metaphor -->
      <div class="absolute bottom-8 left-8 w-12 h-24 bg-blue-100 border border-blue-200"
        style="transform: translateZ(20px);"></div>
      <div class="absolute bottom-6 left-24 w-12 h-16 bg-blue-50 border border-blue-100"
        style="transform: translateZ(10px);"></div>
    </div>

    <!-- Plot 2 -->
    <div class="iso-card w-64 h-64 bg-white rounded-3xl relative group cursor-pointer border border-gray-200">
      <div
        class="absolute -top-12 left-1/2 -translate-x-1/2 bg-purple-600 text-white px-2 py-1 text-xs font-bold rounded shadow-lg opacity-0 group-hover:opacity-100 transition-opacity transform -translate-y-10 group-hover:translate-y-0"
        style="transform: rotateZ(45deg) rotateX(-60deg);">
        NEURAL_V2
      </div>
      <!-- Building Metaphor -->
      <div
        class="absolute center w-32 h-32 rounded-full border-4 border-dashed border-purple-200 top-16 left-16 animate-spin-slow">
      </div>
    </div>

  </div>

  <!-- UI Overlay (Flat) -->
  <div class="absolute top-8 left-8 bg-white/80 backdrop-blur p-4 rounded-xl shadow-sm border border-gray-200">
    <h1 class="font-bold text-gray-900">ATLAS_VIEW</h1>
    <p class="text-xs text-gray-500">Current Zone: SECTOR_7</p>
  </div>

</body>

</html>
